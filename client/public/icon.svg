<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="pinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#1E40AF" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background clean container -->
  <rect width="512" height="512" rx="112" fill="#FFFFFF"/>

  <!-- Location Pin -->
  <g filter="url(#shadow)">
    <path d="M 256 64 C 160 64 88 136 88 232 C 88 338 232 448 256 448 C 280 448 424 338 424 232 C 424 136 352 64 256 64 Z" fill="url(#pinGrad)"/>
  </g>

  <!-- Inner Building Icon (White) -->
  <g fill="#FFFFFF" transform="translate(156, 140)">
    <!-- Central Main Tower -->
    <path d="M 70 50 L 100 20 L 130 50 L 130 170 L 70 170 Z"/>
    <!-- Left Wing Building -->
    <rect x="25" y="80" width="40" height="90" rx="3"/>
    <!-- Right Wing Building -->
    <rect x="135" y="95" width="40" height="75" rx="3"/>
    <!-- Base Platform -->
    <rect x="15" y="170" width="170" height="12" rx="4"/>

    <!-- Windows in Tower (Blue Cutouts) -->
    <rect x="82" y="65" width="14" height="18" rx="2" fill="#2563EB"/>
    <rect x="104" y="65" width="14" height="18" rx="2" fill="#2563EB"/>
    <rect x="82" y="95" width="14" height="18" rx="2" fill="#2563EB"/>
    <rect x="104" y="95" width="14" height="18" rx="2" fill="#2563EB"/>
    <rect x="88" y="130" width="24" height="40" rx="3" fill="#2563EB"/>

    <!-- Windows in Left Wing -->
    <rect x="35" y="95" width="18" height="16" rx="2" fill="#2563EB"/>
    <rect x="35" y="125" width="18" height="16" rx="2" fill="#2563EB"/>

    <!-- Windows in Right Wing -->
    <rect x="147" y="110" width="18" height="16" rx="2" fill="#2563EB"/>
    <rect x="147" y="138" width="18" height="16" rx="2" fill="#2563EB"/>
  </g>
</svg>
